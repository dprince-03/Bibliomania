services:
  # dockerfile: is resolved relative to build.context (declared in the base
  # compose file as each app's own source dir), NOT to this file's own
  # directory — every path below walks back out to infra/docker/ where
  # Dockerfiles actually live (see CLAUDE.md's "Docker images" note).
  app:
    build:
      dockerfile: ../../infra/docker/app/Dockerfile.prod
    restart: always
    environment:
      - APP_ENV=production

  web-app:
    build:
      dockerfile: ../../../infra/docker/web-app/Dockerfile.prod
    restart: always

  web-main:
    build:
      dockerfile: ../../../infra/docker/web-main/Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${WEB_MAIN_API_URL:-http://api.bibliomania.local}
        NEXT_PUBLIC_APP_URL: ${WEB_MAIN_APP_URL:-http://app.bibliomania.local}
    restart: always

  admin-web:
    build:
      dockerfile: ../../infra/docker/admin-web/Dockerfile.prod
    restart: always

  admin:
    build:
      dockerfile: ../../infra/docker/admin/Dockerfile.prod
    restart: always

  mysql:
    restart: always
    # No host port publishing in prod — reachable only inside bibliomania_network.

  redis:
    restart: always
    # No host port publishing in prod — reachable only inside bibliomania_network.

  umami:
    restart: always

  umami-postgres:
    restart: always

  nginx:
    build:
      dockerfile: Dockerfile.prod
    restart: always
    ports:
      - "80:80"
      # 443/TLS deliberately not set up yet — follow-up work (certbot or a
      # managed cert), noted in infra/README.md rather than built here.
