# dockerfile: is resolved relative to build.context (declared in the base
# compose file as each app's own source dir), NOT to this file's own
# directory — every path below walks back out to infra/docker/ where
# Dockerfiles actually live (see .claude/CLAUDE.md's "Docker images" note).
#
# The eight Go services share one Dockerfile.prod; the base file's
# build.args.SERVICE picks the binary.
x-go-prod: &go-prod
  build:
    context: ../../Server/app
    dockerfile: ../../infra/docker/app/Dockerfile.prod
  restart: always

x-go-prod-env: &go-prod-env
  APP_ENV: production

services:
  gateway:
    <<: *go-prod
    build:
      context: ../../Server/app
      dockerfile: ../../infra/docker/app/Dockerfile.prod
      args:
        SERVICE: gateway
    environment:
      <<: *go-prod-env

  auth:
    <<: *go-prod
    build:
      context: ../../Server/app
      dockerfile: ../../infra/docker/app/Dockerfile.prod
      args:
        SERVICE: auth
    environment:
      <<: *go-prod-env

  catalog:
    <<: *go-prod
    build:
      context: ../../Server/app
      dockerfile: ../../infra/docker/app/Dockerfile.prod
      args:
        SERVICE: catalog
    environment:
      <<: *go-prod-env

  borrow:
    <<: *go-prod
    build:
      context: ../../Server/app
      dockerfile: ../../infra/docker/app/Dockerfile.prod
      args:
        SERVICE: borrow
    environment:
      <<: *go-prod-env

  reading:
    <<: *go-prod
    build:
      context: ../../Server/app
      dockerfile: ../../infra/docker/app/Dockerfile.prod
      args:
        SERVICE: reading
    environment:
      <<: *go-prod-env

  user:
    <<: *go-prod
    build:
      context: ../../Server/app
      dockerfile: ../../infra/docker/app/Dockerfile.prod
      args:
        SERVICE: user
    environment:
      <<: *go-prod-env

  notification:
    <<: *go-prod
    build:
      context: ../../Server/app
      dockerfile: ../../infra/docker/app/Dockerfile.prod
      args:
        SERVICE: notification
    environment:
      <<: *go-prod-env

  payment:
    <<: *go-prod
    build:
      context: ../../Server/app
      dockerfile: ../../infra/docker/app/Dockerfile.prod
      args:
        SERVICE: payment
    environment:
      <<: *go-prod-env

  web-app:
    build:
      dockerfile: ../../../infra/docker/web-app/Dockerfile.prod
    restart: always

  web-main:
    build:
      dockerfile: ../../../infra/docker/web-main/Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${WEB_MAIN_API_URL:-http://api.bibliomania.local}
        NEXT_PUBLIC_APP_URL: ${WEB_MAIN_APP_URL:-http://app.bibliomania.local}
    restart: always

  admin-web:
    build:
      dockerfile: ../../infra/docker/admin-web/Dockerfile.prod
    restart: always

  admin:
    build:
      dockerfile: ../../infra/docker/admin/Dockerfile.prod
    restart: always

  # Data stores, brokers and observability: no host port publishing in
  # prod — reachable only inside bibliomania_network.
  mysql:
    restart: always

  postgres:
    restart: always

  mongo:
    restart: always
    # Known gap: MongoDB runs without authentication (a replica set with
    # auth needs a shared keyfile). Acceptable while it's unreachable from
    # outside the network; must be closed before a real deployment — see
    # Server/app/docs/plan.md, "Still open".

  redis:
    restart: always

  seaweedfs:
    restart: always

  rabbitmq:
    restart: always

  kafka:
    restart: always

  nats:
    restart: always

  prometheus:
    restart: always

  loki:
    restart: always

  tempo:
    restart: always

  alloy:
    restart: always

  grafana:
    restart: always

  umami:
    restart: always

  umami-postgres:
    restart: always

  nginx:
    build:
      dockerfile: Dockerfile.prod
    restart: always
    ports:
      - "80:8080" # nginx listens on 8080 (non-root)
      # 443/TLS deliberately not set up yet — follow-up work (certbot or a
      # managed cert), noted in infra/README.md rather than built here.
