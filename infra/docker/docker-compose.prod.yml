services:
  app:
    build:
      dockerfile: app/Dockerfile.prod
    restart: always
    environment:
      - APP_ENV=production

  web-app:
    build:
      dockerfile: web-app/Dockerfile.prod
    restart: always

  web-main:
    build:
      dockerfile: web-main/Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${WEB_MAIN_API_URL:-http://api.bibliotheca.local}
        NEXT_PUBLIC_APP_URL: ${WEB_MAIN_APP_URL:-http://app.bibliotheca.local}
    restart: always

  admin-web:
    build:
      dockerfile: admin-web/Dockerfile.prod
    restart: always

  admin:
    build:
      dockerfile: admin/Dockerfile.prod
    restart: always

  mysql:
    restart: always
    # No host port publishing in prod — reachable only inside bibliotheca_network.

  redis:
    restart: always
    # No host port publishing in prod — reachable only inside bibliotheca_network.

  umami:
    restart: always

  umami-postgres:
    restart: always

  nginx:
    build:
      dockerfile: Dockerfile.prod
    restart: always
    ports:
      - "80:80"
      # 443/TLS deliberately not set up yet — follow-up work (certbot or a
      # managed cert), noted in infra/README.md rather than built here.
