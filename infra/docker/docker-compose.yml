name: bibliomania

services:
  # ── Go API ──────────────────────────────────────────────
  app:
    image: bibliomania-app
    container_name: bibliomania-app
    build:
      context: ../../Server/app
    restart: unless-stopped
    env_file:
      - ../../Server/app/.env
    environment:
      # These override whatever Server/app/.env sets for the same keys, so
      # the `app` container always agrees with `mysql`'s init credentials
      # below — both come from the root .env, not two files that have to be
      # kept in sync by hand.
      - APP_ENV=development
      - DB_HOST=mysql
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bibliomania_network

  # ── Web: product app ────────────────────────────────────
  # API_INTERNAL_URL is server-only (no NEXT_PUBLIC_ prefix) — used by
  # src/lib/api.js's server-side calls, reaching the app service directly
  # inside bibliomania_network instead of round-tripping through nginx.
  # NEXT_PUBLIC_API_URL stays for any direct client-side calls a later step
  # adds. See Client/docs/web-app-plan.md's "Two API base URLs, not one".
  web-app:
    image: bibliomania-web-app
    container_name: bibliomania-web-app
    build:
      context: ../../Client/web/app
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=${WEB_APP_API_URL:-http://api.bibliomania.local}
      - API_INTERNAL_URL=${WEB_APP_API_INTERNAL_URL:-http://app:8080}
    depends_on:
      - app
    networks:
      - bibliomania_network

  # ── Web: marketing/main site ────────────────────────────
  # NEXT_PUBLIC_* here covers dev's live `next dev` process. In prod this is
  # a static export with no Node runtime at request time, so the same vars
  # also need to reach `docker build` as build args — see
  # docker-compose.prod.yml.
  web-main:
    image: bibliomania-web-main
    container_name: bibliomania-web-main
    build:
      context: ../../Client/web/main
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=${WEB_MAIN_API_URL:-http://api.bibliomania.local}
      - NEXT_PUBLIC_APP_URL=${WEB_MAIN_APP_URL:-http://app.bibliomania.local}
    networks:
      - bibliomania_network

  # ── Admin: dashboard frontend ────────────────────────────
  admin-web:
    image: bibliomania-admin-web
    container_name: bibliomania-admin-web
    build:
      context: ../../Client/admin
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=${ADMIN_WEB_API_URL:-http://admin.bibliomania.local/api}
    depends_on:
      - admin
    networks:
      - bibliomania_network

  # ── Admin: backend API ───────────────────────────────────
  admin:
    image: bibliomania-admin
    container_name: bibliomania-admin
    build:
      context: ../../Server/admin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bibliomania_network

  # ── MySQL (app database) ─────────────────────────────────
  mysql:
    image: mysql:8.4
    container_name: bibliomania-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      # No migrations mount here: cmd/api/main.go already runs golang-migrate
      # on boot (database.RunMigration). Mounting migrations/ into
      # /docker-entrypoint-initdb.d would also run every *.sql file
      # alphabetically once, which for paired up/down files immediately
      # undoes each "up" with the following "down".
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - bibliomania_network

  # ── Redis (app cache) ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: bibliomania-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-}
      --appendonly yes
      --maxmemory 500mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - bibliomania_network

  # ── Umami analytics ───────────────────────────────────────
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: bibliomania-umami
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${UMAMI_POSTGRES_USER}:${UMAMI_POSTGRES_PASSWORD}@umami-postgres:5432/${UMAMI_POSTGRES_DB}
      APP_SECRET: ${UMAMI_APP_SECRET}
    depends_on:
      umami-postgres:
        condition: service_healthy
    networks:
      - bibliomania_network

  # Umami's own Postgres — deliberately separate from `mysql` above, which is
  # the application's database. Different engine, different creds, different
  # volume: never point umami at the app's MySQL instance.
  umami-postgres:
    image: postgres:16-alpine
    container_name: bibliomania-umami-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${UMAMI_POSTGRES_USER}
      POSTGRES_PASSWORD: ${UMAMI_POSTGRES_PASSWORD}
      POSTGRES_DB: ${UMAMI_POSTGRES_DB}
    volumes:
      - umami_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${UMAMI_POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - bibliomania_network

  # ── Reverse proxy ─────────────────────────────────────────
  nginx:
    image: bibliomania-nginx
    container_name: bibliomania-nginx
    build:
      context: ../nginx
    restart: unless-stopped
    depends_on:
      - app
      - web-app
      - web-main
      - admin-web
      - admin
      - umami
    networks:
      - bibliomania_network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  go_modules:
    driver: local
  umami_postgres_data:
    driver: local
  web_app_node_modules:
    driver: local
  web_main_node_modules:
    driver: local
  admin_web_node_modules:
    driver: local
  admin_api_node_modules:
    driver: local

networks:
  bibliomania_network:
    driver: bridge
