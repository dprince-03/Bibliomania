# Alertmanager — groups, dedupes and routes the alerts in
# infra/observability/prometheus/alerts.yml.
#
# Default receiver: email to Mailpit (dev Compose + the local k8s overlay),
# so alerts are visible at http://localhost:9089 with no setup. Production
# replaces this file (infra/k8s/overlays/prod patches the ConfigMap) with a
# real receiver — Slack/PagerDuty/email; see infra/README.md "Alerting".
global:
  smtp_smarthost: mailpit:1025
  smtp_from: alerts@bibliomania.local
  smtp_require_tls: false

route:
  receiver: team-email
  group_by: [alertname, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: team-email
      repeat_interval: 1h

# A critical alert on a service silences that service's warnings.
inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [service]

receivers:
  - name: team-email
    email_configs:
      - to: oncall@bibliomania.local
        send_resolved: true
