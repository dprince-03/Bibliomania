# Scrape config for the whole stack. Every Go service exposes /metrics on
# its HTTP port (8080); the `service` label is added here so one dashboard
# can split every panel by service.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: services
    metrics_path: /metrics
    static_configs:
      - { targets: ["gateway:8080"], labels: { service: gateway } }
      - { targets: ["auth:8080"], labels: { service: auth-service } }
      - { targets: ["catalog:8080"], labels: { service: catalog-service } }
      - { targets: ["borrow:8080"], labels: { service: borrow-service } }
      - { targets: ["reading:8080"], labels: { service: reading-service } }
      - { targets: ["user:8080"], labels: { service: user-service } }
      - { targets: ["notification:8080"], labels: { service: notification-service } }
      - { targets: ["payment:8080"], labels: { service: payment-service } }

  # ── Databases ───────────────────────────────────────────
  - job_name: mysql
    static_configs:
      - { targets: ["mysqld-exporter:9104"], labels: { database: auth } }
  - job_name: postgres
    static_configs:
      - { targets: ["postgres-exporter:9187"] }
  - job_name: mongodb
    static_configs:
      - { targets: ["mongodb-exporter:9216"], labels: { database: reading } }
  - job_name: redis
    static_configs:
      - { targets: ["redis-exporter:9121"] }

  # ── Brokers ─────────────────────────────────────────────
  - job_name: rabbitmq
    static_configs:
      - { targets: ["rabbitmq:15692"] } # built-in rabbitmq_prometheus plugin
  - job_name: kafka
    static_configs:
      - { targets: ["kafka-exporter:9308"] }
  - job_name: nats
    static_configs:
      - { targets: ["nats-exporter:7777"] }

  # ── Observability stack itself ──────────────────────────
  - job_name: prometheus
    static_configs:
      - { targets: ["localhost:9090"] }
  - job_name: tempo
    static_configs:
      - { targets: ["tempo:3200"] }
  - job_name: loki
    static_configs:
      - { targets: ["loki:3100"] }
