# catalog-service's cache — never a system of record, so no persistent
# volume: losing it only costs cache misses.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: { app.kubernetes.io/name: redis, app.kubernetes.io/part-of: bibliomania, app.kubernetes.io/component: cache }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: redis }
  template:
    metadata:
      labels: { app.kubernetes.io/name: redis, app.kubernetes.io/part-of: bibliomania, app.kubernetes.io/component: cache }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - { name: redis, containerPort: 6379 }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 320Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: { app.kubernetes.io/name: redis, app.kubernetes.io/part-of: bibliomania }
spec:
  selector: { app.kubernetes.io/name: redis }
  ports:
    - { name: redis, port: 6379, targetPort: redis }
