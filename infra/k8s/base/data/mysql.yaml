# auth-service's MySQL. Init SQL (server settings) comes from the same
# infra/docker/mysql/init/*.sql Compose mounts — see kustomization.yaml's
# configMapGenerator. Tables: auth-service's own migrations.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  labels: { app.kubernetes.io/name: mysql, app.kubernetes.io/part-of: bibliomania, app.kubernetes.io/component: database }
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: mysql }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mysql, app.kubernetes.io/part-of: bibliomania, app.kubernetes.io/component: database }
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - { name: mysql, containerPort: 3306 }
          env:
            - { name: MYSQL_DATABASE, value: bibliomania_auth }
            - { name: MYSQL_USER, value: auth }
            - name: MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: bibliomania-secrets, key: AUTH_DB_PASSWORD } }
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: bibliomania-secrets, key: AUTH_DB_ROOT_PASSWORD } }
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -u root -p\"$MYSQL_ROOT_PASSWORD\""]
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
      volumes:
        - name: init
          configMap: { name: mysql-init }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  labels: { app.kubernetes.io/name: mysql, app.kubernetes.io/part-of: bibliomania }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: mysql }
  ports:
    - { name: mysql, port: 3306, targetPort: mysql }
