# One Postgres server, four databases/roles (catalog, borrow, user,
# payment) — created by the same infra/docker/postgres/init/*.sql Compose
# mounts (passwords read from env via psql \getenv).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: bibliomania, app.kubernetes.io/component: database }
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: bibliomania, app.kubernetes.io/component: database }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          args: ["-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all"]
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - { name: POSTGRES_USER, value: postgres }
            # A subdirectory: the volume's root holds lost+found on some
            # storage classes, which initdb refuses.
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: bibliomania-secrets, key: POSTGRES_PASSWORD } }
            - name: CATALOG_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: bibliomania-secrets, key: CATALOG_DB_PASSWORD } }
            - name: BORROW_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: bibliomania-secrets, key: BORROW_DB_PASSWORD } }
            - name: USER_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: bibliomania-secrets, key: USER_DB_PASSWORD } }
            - name: PAYMENT_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: bibliomania-secrets, key: PAYMENT_DB_PASSWORD } }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "postgres"] }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
      volumes:
        - name: init
          configMap: { name: postgres-init }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: bibliomania }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: postgres }
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
