# RabbitMQ — auth / user / catalog events. Plugins file is the same
# infra/docker/rabbitmq/enabled_plugins Compose mounts (management UI +
# Prometheus endpoint on :15692).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  labels: { app.kubernetes.io/name: rabbitmq, app.kubernetes.io/part-of: bibliomania, app.kubernetes.io/component: broker }
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: rabbitmq }
  template:
    metadata:
      labels: { app.kubernetes.io/name: rabbitmq, app.kubernetes.io/part-of: bibliomania, app.kubernetes.io/component: broker }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4.2-management-alpine
          ports:
            - { name: amqp, containerPort: 5672 }
            - { name: management, containerPort: 15672 }
            - { name: metrics, containerPort: 15692 }
          env:
            - { name: RABBITMQ_DEFAULT_USER, value: bibliomania }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: { secretKeyRef: { name: bibliomania-secrets, key: RABBITMQ_PASSWORD } }
          readinessProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "ping"] }
            periodSeconds: 15
            timeoutSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 768Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/rabbitmq }
            - { name: plugins, mountPath: /etc/rabbitmq/enabled_plugins, subPath: enabled_plugins }
      volumes:
        - name: plugins
          configMap: { name: rabbitmq-plugins }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels: { app.kubernetes.io/name: rabbitmq, app.kubernetes.io/part-of: bibliomania }
spec:
  selector: { app.kubernetes.io/name: rabbitmq }
  ports:
    - { name: amqp, port: 5672, targetPort: amqp }
    - { name: management, port: 15672, targetPort: management }
    - { name: metrics, port: 15692, targetPort: metrics }
