# Kafka — borrow + payment events. Single-node KRaft (broker + controller
# in one process, no ZooKeeper). Headless Service: "kafka" resolves to the
# pod for bootstrap, and the advertised listener (kafka-0.kafka) is the
# pod's stable DNS name, which clients use after the metadata response.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels: { app.kubernetes.io/name: kafka, app.kubernetes.io/part-of: bibliomania, app.kubernetes.io/component: broker }
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: kafka }
  template:
    metadata:
      labels: { app.kubernetes.io/name: kafka, app.kubernetes.io/part-of: bibliomania, app.kubernetes.io/component: broker }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # the image's appuser
        runAsGroup: 1000
        fsGroup: 1000 # so it can write the volume
        seccompProfile: { type: RuntimeDefault }
      # The image's entrypoint (re)writes /opt/kafka/config at startup, which a
      # read-only root filesystem forbids — so the stock config is copied into
      # a writable volume first and mounted over it.
      initContainers:
        - name: config
          image: apache/kafka:3.9.1
          # -R, not -a: a non-root user may not set timestamps on the mount point.
          command: ["sh", "-c", "cp -R /opt/kafka/config/. /config/"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: config, mountPath: /config }
      containers:
        - name: kafka
          image: apache/kafka:3.9.1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports:
            - { name: kafka, containerPort: 9092 }
            - { name: controller, containerPort: 9093 }
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka-0.kafka:9092" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@kafka-0.kafka:9093" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            - { name: KAFKA_NUM_PARTITIONS, value: "3" }
            - { name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data/logs }
          readinessProbe:
            tcpSocket: { port: kafka }
            periodSeconds: 10
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 1536Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
            - { name: config, mountPath: /opt/kafka/config }
            - { name: logs, mountPath: /opt/kafka/logs }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels: { app.kubernetes.io/name: kafka, app.kubernetes.io/part-of: bibliomania }
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app.kubernetes.io/name: kafka }
  ports:
    - { name: kafka, port: 9092, targetPort: kafka }
    - { name: controller, port: 9093, targetPort: controller }
