# NATS with JetStream — reading events.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  labels: { app.kubernetes.io/name: nats, app.kubernetes.io/part-of: bibliomania, app.kubernetes.io/component: broker }
spec:
  serviceName: nats
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: nats }
  template:
    metadata:
      labels: { app.kubernetes.io/name: nats, app.kubernetes.io/part-of: bibliomania, app.kubernetes.io/component: broker }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: nats
          image: nats:2.11-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          args: ["-js", "-sd", "/data", "-m", "8222"]
          ports:
            - { name: client, containerPort: 4222 }
            - { name: monitor, containerPort: 8222 }
          readinessProbe:
            httpGet: { path: /healthz, port: monitor }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  labels: { app.kubernetes.io/name: nats, app.kubernetes.io/part-of: bibliomania }
spec:
  selector: { app.kubernetes.io/name: nats }
  ports:
    - { name: client, port: 4222, targetPort: client }
    - { name: monitor, port: 8222, targetPort: monitor }
