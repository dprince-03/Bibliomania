# Non-secret settings shared by every Go service (envFrom), the Kubernetes
# counterpart of the x-go-env block in infra/docker/docker-compose.yml.
# Secrets (passwords, JWT_SECRET, provider keys) come from the
# bibliomania-secrets Secret — generated by overlays/local, created
# out-of-band for prod.
apiVersion: v1
kind: ConfigMap
metadata:
  name: bibliomania-common
data:
  APP_ENV: development
  SERVER_PORT: "8080"
  GRPC_PORT: "9090"
  # Long enough for book file uploads/downloads through the gateway.
  SERVER_WRITE_TIMEOUT: "120"
  OTEL_EXPORTER_OTLP_ENDPOINT: tempo:4317

  # gRPC through the headless *-grpc Services (one address per pod,
  # round-robin across replicas — see services/*.yaml).
  CATALOG_GRPC_ADDR: dns:///catalog-grpc:9090
  BORROW_GRPC_ADDR: dns:///borrow-grpc:9090
  READING_GRPC_ADDR: dns:///reading-grpc:9090
  USER_GRPC_ADDR: dns:///user-grpc:9090

  # The gateway's REST proxy targets.
  AUTH_HTTP_URL: http://auth:8080
  CATALOG_HTTP_URL: http://catalog:8080
  BORROW_HTTP_URL: http://borrow:8080
  READING_HTTP_URL: http://reading:8080
  USER_HTTP_URL: http://user:8080
  PAYMENT_HTTP_URL: http://payment:8080

  KAFKA_BROKERS: kafka-0.kafka:9092
  NATS_URL: nats://nats:4222
  MONGO_URL: mongodb://mongo-0.mongo:27017/?replicaSet=rs0
  MONGO_DB: bibliomania_reading
  REDIS_HOST: redis
  REDIS_PORT: "6379"

  STORAGE_PATH: /app/storage
  MAX_UPLOAD_SIZE_MB: "50"
  JWT_ACCESS_TOKEN_TTL: "15"
  JWT_REFRESH_TOKEN_TTL: "10080"
  RATE_LIMIT_RPS: "100"
  RATE_LIMIT_BURST: "200"
  BORROW_LOAN_DAYS: "14"
  OVERDUE_SWEEP_INTERVAL_SECONDS: "300"

  MAIL_FROM: "Bibliomania <no-reply@bibliomania.local>"
  PAYSTACK_CURRENCIES: NGN,GHS,ZAR,KES
  PAYMENT_SUCCESS_URL: http://app.bibliomania.local/payments/success
  PAYMENT_CANCEL_URL: http://app.bibliomania.local/payments/cancel
  API_DEPRECATED_VERSIONS: ""

  # Browser-facing URLs for the web clients.
  PUBLIC_API_URL: http://api.bibliomania.local
  PUBLIC_ADMIN_API_URL: http://admin.bibliomania.local/api
