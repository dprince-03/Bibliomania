# Host-based routing, mirroring infra/nginx/conf.d/default.*.conf. The
# ingress controller is Traefik (ingress-nginx was retired in March 2026) —
# installed by `make k8s-up` / Terraform with infra/k8s/kind/traefik-values.yaml.
# Hostnames are the .local dev ones; the prod overlay replaces them.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bibliomania
  annotations:
    # Uploads/downloads of book files go through the gateway.
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: api.bibliomania.local
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: gateway, port: { name: http } } } }
    - host: app.bibliomania.local
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web-app, port: { name: http } } } }
    - host: bibliomania.local
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web-main, port: { name: http } } } }
    - host: admin.bibliomania.local
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: admin-web, port: { name: http } } } }
    - host: grafana.bibliomania.local
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: grafana, port: { name: http } } } }
    - host: analytics.bibliomania.local
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: umami, port: { name: http } } } }
---
# admin.bibliomania.local/api/* → the admin backend with /api stripped,
# like nginx's `location /api/ { proxy_pass http://admin:4000/; }`.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api-prefix
spec:
  stripPrefix:
    prefixes: ["/api"]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bibliomania-admin-api
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    # <namespace>-<middleware>@kubernetescrd
    traefik.ingress.kubernetes.io/router.middlewares: bibliomania-strip-api-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: admin.bibliomania.local
      http:
        paths:
          - { path: /api, pathType: Prefix, backend: { service: { name: admin, port: { name: http } } } }
