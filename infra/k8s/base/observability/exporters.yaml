apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats-exporter
  labels: { app.kubernetes.io/name: nats-exporter, app.kubernetes.io/part-of: bibliomania, app.kubernetes.io/component: observability }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: nats-exporter } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: nats-exporter, app.kubernetes.io/part-of: bibliomania, app.kubernetes.io/component: observability }
    spec:
      containers:
        - name: exporter
          image: natsio/prometheus-nats-exporter:0.17.3
          args: ["-varz", "-connz", "-jsz=all", "http://nats:8222"]
