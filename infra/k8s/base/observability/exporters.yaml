# Prometheus exporters for every database and broker (RabbitMQ needs none —
# its rabbitmq_prometheus plugin serves :15692 itself). Service names and
# ports match Compose, so the scrape config's static targets are shared.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysqld-exporter
  labels: { app.kubernetes.io/name: mysqld-exporter, app.kubernetes.io/part-of: bibliomania, app.kubernetes.io/component: observability }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: mysqld-exporter } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mysqld-exporter, app.kubernetes.io/part-of: bibliomania, app.kubernetes.io/component: observability }
    spec:
      containers:
        - name: exporter
          image: prom/mysqld-exporter:v0.17.2
          args: ["--mysqld.address=mysql:3306", "--mysqld.username=root"]
          env:
            - name: MYSQLD_EXPORTER_PASSWORD
              valueFrom: { secretKeyRef: { name: bibliomania-secrets, key: AUTH_DB_ROOT_PASSWORD } }
          ports: [{ name: metrics, containerPort: 9104 }]
          resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 128Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: mysqld-exporter }
spec:
  selector: { app.kubernetes.io/name: mysqld-exporter }
  ports: [{ name: metrics, port: 9104, targetPort: metrics }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  labels: { app.kubernetes.io/name: postgres-exporter, app.kubernetes.io/part-of: bibliomania, app.kubernetes.io/component: observability }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: postgres-exporter } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres-exporter, app.kubernetes.io/part-of: bibliomania, app.kubernetes.io/component: observability }
    spec:
      containers:
        - name: exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
          env:
            - { name: DATA_SOURCE_URI, value: "postgres:5432/postgres?sslmode=disable" }
            - { name: DATA_SOURCE_USER, value: postgres }
            - name: DATA_SOURCE_PASS
              valueFrom: { secretKeyRef: { name: bibliomania-secrets, key: POSTGRES_PASSWORD } }
          ports: [{ name: metrics, containerPort: 9187 }]
          resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 128Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres-exporter }
spec:
  selector: { app.kubernetes.io/name: postgres-exporter }
  ports: [{ name: metrics, port: 9187, targetPort: metrics }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-exporter
  labels: { app.kubernetes.io/name: mongodb-exporter, app.kubernetes.io/part-of: bibliomania, app.kubernetes.io/component: observability }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: mongodb-exporter } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mongodb-exporter, app.kubernetes.io/part-of: bibliomania, app.kubernetes.io/component: observability }
    spec:
      containers:
        - name: exporter
          image: percona/mongodb_exporter:0.44
          args: ["--mongodb.uri=mongodb://mongo-0.mongo:27017/?directConnection=true", "--collect-all", "--compatible-mode"]
          ports: [{ name: metrics, containerPort: 9216 }]
          resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 128Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: mongodb-exporter }
spec:
  selector: { app.kubernetes.io/name: mongodb-exporter }
  ports: [{ name: metrics, port: 9216, targetPort: metrics }]
---
