# gateway — generated alongside the other Go services; each is the
# same shape: one Deployment running the bibliomania-gateway image
# (infra/docker/app/Dockerfile.prod, SERVICE=gateway), config from the
# bibliomania-common ConfigMap, secrets from bibliomania-secrets.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: bibliomania
    app.kubernetes.io/component: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/part-of: bibliomania
        app.kubernetes.io/component: service
        bibliomania.dev/service: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: gateway
          image: bibliomania-gateway
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: bibliomania-common
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bibliomania-secrets
                  key: REDIS_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bibliomania-secrets
                  key: JWT_SECRET
          # Gateway readiness = /livez, NOT /health: its /health aggregates
          # every service, and one unhealthy service must not take the whole
          # API out of rotation. Liveness = /livez too.
          readinessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Writable /tmp on a read-only root filesystem.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: bibliomania
spec:
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
