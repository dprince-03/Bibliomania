# payment-service — generated alongside the other Go services; each is the
# same shape: one Deployment running the bibliomania-payment image
# (infra/docker/app/Dockerfile.prod, SERVICE=payment), config from the
# bibliomania-common ConfigMap, secrets from bibliomania-secrets.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  labels:
    app.kubernetes.io/name: payment
    app.kubernetes.io/part-of: bibliomania
    app.kubernetes.io/component: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payment
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment
        app.kubernetes.io/part-of: bibliomania
        app.kubernetes.io/component: service
        bibliomania.dev/service: payment-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: payment
          image: bibliomania-payment
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: bibliomania-common
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bibliomania-secrets
                  key: JWT_SECRET
            - name: PAYMENT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bibliomania-secrets
                  key: PAYMENT_DB_PASSWORD
            - name: DATABASE_URL
              value: "postgres://payment:$(PAYMENT_DB_PASSWORD)@postgres:5432/bibliomania_payment?sslmode=disable"
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: bibliomania-secrets
                  key: STRIPE_SECRET_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: bibliomania-secrets
                  key: STRIPE_WEBHOOK_SECRET
            - name: PAYSTACK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: bibliomania-secrets
                  key: PAYSTACK_SECRET_KEY
          # Readiness = /health (checks this service's database/brokers):
          # traffic stops while a dependency is down. Liveness = /livez (the
          # process answers) — a database blip must not restart pods.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Writable /tmp on a read-only root filesystem.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: payment
  labels:
    app.kubernetes.io/name: payment
    app.kubernetes.io/part-of: bibliomania
spec:
  selector:
    app.kubernetes.io/name: payment
  ports:
    - name: http
      port: 8080
      targetPort: http
