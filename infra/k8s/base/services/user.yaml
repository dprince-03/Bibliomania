# user-service — generated alongside the other Go services; each is the
# same shape: one Deployment running the bibliomania-user image
# (infra/docker/app/Dockerfile.prod, SERVICE=user), config from the
# bibliomania-common ConfigMap, secrets from bibliomania-secrets.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
  labels:
    app.kubernetes.io/name: user
    app.kubernetes.io/part-of: bibliomania
    app.kubernetes.io/component: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: user
  template:
    metadata:
      labels:
        app.kubernetes.io/name: user
        app.kubernetes.io/part-of: bibliomania
        app.kubernetes.io/component: service
        bibliomania.dev/service: user-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: user
          image: bibliomania-user
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: bibliomania-common
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bibliomania-secrets
                  key: JWT_SECRET
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bibliomania-secrets
                  key: INTERNAL_API_TOKEN
            - name: USER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bibliomania-secrets
                  key: USER_DB_PASSWORD
            - name: DATABASE_URL
              value: "postgres://users:$(USER_DB_PASSWORD)@postgres:5432/bibliomania_user?sslmode=disable"
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bibliomania-secrets
                  key: RABBITMQ_PASSWORD
            - name: RABBITMQ_URL
              value: "amqp://bibliomania:$(RABBITMQ_PASSWORD)@rabbitmq:5672/"
          # Readiness = /health (checks this service's database/brokers):
          # traffic stops while a dependency is down. Liveness = /livez (the
          # process answers) — a database blip must not restart pods.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Writable /tmp on a read-only root filesystem.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: user
  labels:
    app.kubernetes.io/name: user
    app.kubernetes.io/part-of: bibliomania
spec:
  selector:
    app.kubernetes.io/name: user
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 9090
      targetPort: grpc
---
# Headless: resolves to every pod's IP, so gRPC clients (round_robin, see
# Server/app/internal/grpcx) spread calls across replicas instead of pinning
# one long-lived HTTP/2 connection to a single pod behind a ClusterIP.
apiVersion: v1
kind: Service
metadata:
  name: user-grpc
  labels:
    app.kubernetes.io/name: user
    app.kubernetes.io/part-of: bibliomania
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: user
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc
