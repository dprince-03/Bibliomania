# MySQL replication for auth-service: base's mysql becomes a GTID primary
# (see the patch in kustomization.yaml) and this StatefulSet is an async
# read-only replica that follows it (auto-positioned by GTID). A hot
# standby: failover is manual — promote with `STOP REPLICA; RESET REPLICA
# ALL; SET PERSIST super_read_only = OFF; SET PERSIST read_only = OFF;`
# (PERSIST, since 01-start-replica.sh persisted them ON) and re-point the
# "mysql" Service — see infra/k8s/README.md. (For automatic MySQL failover,
# use a managed database or an operator such as Percona's.)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-replica
  namespace: bibliomania
  labels: { app.kubernetes.io/name: mysql-replica, app.kubernetes.io/part-of: bibliomania, app.kubernetes.io/component: database }
spec:
  serviceName: mysql-replica
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: mysql-replica }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mysql-replica, app.kubernetes.io/part-of: bibliomania, app.kubernetes.io/component: database }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mysql
          image: mysql:8.4
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          args:
            - --server-id=2
            - --gtid-mode=ON
            - --enforce-gtid-consistency=ON
            # read_only / super_read_only: persisted by 01-start-replica.sh
            # after setup — as flags they blocked the first-boot init.
            - --relay-log=mysql-relay
          env:
            # No MYSQL_DATABASE: the database arrives by replication; creating
            # it locally too makes the replicated CREATE DATABASE fail and
            # stops the replica's SQL thread.
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: bibliomania-secrets, key: AUTH_DB_ROOT_PASSWORD } }
            - name: MYSQL_REPLICATION_PASSWORD
              valueFrom: { secretKeyRef: { name: bibliomania-secrets, key: MYSQL_REPLICATION_PASSWORD } }
          readinessProbe:
            exec:
              command: ["sh", "-c", "MYSQL_PWD=\"$MYSQL_ROOT_PASSWORD\" mysql -h 127.0.0.1 -uroot -N -e \"SELECT 1\""]
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: run, mountPath: /var/run/mysqld }
            - { name: tmp, mountPath: /tmp }
            - { name: files, mountPath: /var/lib/mysql-files }
            - { name: data, mountPath: /var/lib/mysql }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: files
          emptyDir: {}
        - name: init
          configMap: { name: mysql-replica-init }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-replica
  namespace: bibliomania
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: mysql-replica }
  ports:
    - { name: mysql, port: 3306 }
