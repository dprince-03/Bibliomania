# Local cluster for overlays/local — `make -C infra/k8s cluster` (or
# Terraform, infra/terraform/local, which declares the same settings).
# One node; the ingress controller (Traefik) binds the node's ports 80/443,
# published on the host as 9097/9098 (see docs/PORTS.md).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: bibliomania
nodes:
  - role: control-plane
    image: kindest/node:v1.34.0
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - { containerPort: 80, hostPort: 9097, protocol: TCP }
      - { containerPort: 443, hostPort: 9098, protocol: TCP }
