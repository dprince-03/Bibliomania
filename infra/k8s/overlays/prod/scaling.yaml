# Every stateless Deployment autoscales on CPU (needs metrics-server).
# Horizontal scaling is safe for all of them: no local state (catalog's
# files are in object storage), outbox relays lock rows (SKIP LOCKED /
# leases), consumers share work through broker consumer groups / queues,
# and the overdue sweeper's UPDATE is idempotent. The gateway is the one
# service every request crosses, so it has the widest range; disruption
# budgets keep capacity up through node drains.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: gateway }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway
spec:
  minAvailable: 1
  selector: { matchLabels: { app.kubernetes.io/name: gateway } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: stateless-services
spec:
  maxUnavailable: 1
  selector:
    matchExpressions:
      - { key: app.kubernetes.io/component, operator: In, values: [service] }
