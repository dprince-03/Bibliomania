# See default.dev.conf for why this + `set $upstream` on every proxy_pass:
# lazy per-request DNS resolution via Docker's embedded resolver, instead of
# nginx hard-failing at startup if an upstream isn't resolvable yet.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name bibliotheca.local;

    # Prod web-main is a static export served by an nginx container of its
    # own (port 80), not a Next.js dev server (port 3000) — see
    # infra/docker/web-main/Dockerfile.prod.
    location / {
        set $upstream http://web-main:80;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
    server_name app.bibliotheca.local;

    location / {
        set $upstream http://web-app:3000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
    server_name admin.bibliotheca.local;

    location /api/ {
        set $upstream http://admin-api:4000/;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        set $upstream http://admin-web:3000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
    server_name api.bibliotheca.local;

    location / {
        set $upstream http://server:8080;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
    server_name analytics.bibliotheca.local;

    location / {
        set $upstream http://umami:3000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# No adminer/mailpit blocks — those services don't exist in prod at all.
