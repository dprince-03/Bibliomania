# Docker's embedded DNS resolver. Combined with variables in proxy_pass
# below, this makes nginx resolve upstream hostnames lazily per-request
# instead of once at startup — so nginx boots fine even if a dependency
# container is still starting, and picks up a restarted container's new IP
# without needing an nginx reload.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name bibliotheca.local;

    location / {
        set $upstream http://web-main:3000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

