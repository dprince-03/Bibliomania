                  - $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.PaginatedResponse'
                  - properties:
                      items:
                        items:
                          $ref: '#/definitions/internal_modules_user.UserResponse'
                        type: array
                    type: object
              type: object
        "401":
          description: missing/invalid token
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIError'
        "403":
          description: admin only
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: List every user
      tags:
      - users
  /users/{id}/status:
    patch:
      consumes:
      - application/json
      description: Deactivating immediately blocks the user's next login and any endpoint
        that filters to is_active=TRUE (e.g. their own GET /users/me starts 404ing,
        even with a still-valid token).
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: New status
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_user.UpdateUserStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIResponse'
        "400":
          description: invalid id/body
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIError'
        "401":
          description: missing/invalid token
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIError'
        "403":
          description: admin only
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Activate or deactivate a user
      tags:
      - users
  /users/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_modules_user.UserProfileResponse'
              type: object
        "401":
          description: missing/invalid token
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIError'
        "404":
          description: account deactivated
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Get my profile
      tags:
      - users
    patch:
      consumes:
      - application/json
      description: Only touches profile fields (phone_number, bio, profile_picture)
        — no route changes first_name/last_name/email yet.
      parameters:
      - description: Fields to update (all optional)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_user.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_modules_user.UserProfileResponse'
              type: object
        "400":
          description: invalid body
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIError'
        "401":
          description: missing/invalid token
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIError'
        "422":
          description: validation failed
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Update my profile
      tags:
      - users
  /users/me/history:
    get:
      description: Reading activity (from session data) — not the same as GET /borrows/my,
        which is checkout history.
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIResponse'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.PaginatedResponse'
                  - properties:
                      items:
                        items:
                          $ref: '#/definitions/internal_modules_user.HistoryEntryResponse'
                        type: array
                    type: object
              type: object
        "401":
          description: missing/invalid token
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Get my reading history
      tags:
      - users
  /users/me/library:
    get:
      parameters:
      - description: Filter to one status
        enum:
        - wishlist
        - to_read
        - reading
        - completed
        - dropped
        in: query
        name: status
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIResponse'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.PaginatedResponse'
                  - properties:
                      items:
                        items:
                          $ref: '#/definitions/internal_modules_user.LibraryEntryResponse'
                        type: array
                    type: object
              type: object
        "401":
          description: missing/invalid token
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Get my library
      tags:
      - users
  /users/me/library/{bookId}:
    patch:
      consumes:
      - application/json
      description: Upsert — calling it again for the same book updates the existing
        entry rather than creating a duplicate.
      parameters:
      - description: Book ID
        in: path
        name: bookId
        required: true
        type: integer
      - description: New status
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_user.UpdateLibraryStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_modules_user.LibraryEntryResponse'
              type: object
        "400":
          description: invalid book id/body
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIError'
        "401":
          description: missing/invalid token
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIError'
        "404":
          description: book not found
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIError'
        "422":
          description: validation failed
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Set a book's status on my library shelf
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and the JWT access token (obtained
      from /auth/login or /auth/register).
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
