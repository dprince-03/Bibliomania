basePath: /api/v1
definitions:
  github_com_dprince-03_Bibliotheca_internal_modules_user.UserResponse:
    properties:
      email:
        type: string
      first_name:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      last_name:
        type: string
      role:
        type: string
    type: object
  github_com_dprince-03_Bibliotheca_internal_utils.APIError:
    properties:
      code:
        type: integer
      error:
        type: string
      success:
        type: boolean
    type: object
  github_com_dprince-03_Bibliotheca_internal_utils.APIResponse:
    properties:
      data: {}
      message:
        type: string
      success:
        type: boolean
    type: object
  github_com_dprince-03_Bibliotheca_internal_utils.PaginatedResponse:
    properties:
      has_next_page:
        type: boolean
      has_previous_page:
        type: boolean
      items: {}
      limit:
        type: integer
      page:
        type: integer
      total_count:
        type: integer
      total_pages:
        type: integer
    type: object
  internal_modules_auth.AuthResponse:
    properties:
      token:
        $ref: '#/definitions/internal_modules_auth.TokenResponse'
      user:
        $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_modules_user.UserResponse'
    type: object
  internal_modules_auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  internal_modules_auth.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  internal_modules_auth.RegisterRequest:
    properties:
      email:
        type: string
      first_name:
        maxLength: 100
        minLength: 2
        type: string
      last_name:
        maxLength: 100
        minLength: 2
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - first_name
    - last_name
    - password
    type: object
  internal_modules_auth.TokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        description: seconds
        type: integer
      refresh_token:
        type: string
    type: object
  internal_modules_borrow.BorrowRequest:
    properties:
      book_id:
        type: integer
    required:
    - book_id
    type: object
  internal_modules_borrow.BorrowResponse:
    properties:
      book_id:
        type: integer
      book_title:
        type: string
      borrowed_at:
        type: string
      due_at:
        type: string
      id:
        type: integer
      returned_at:
        type: string
      status:
        type: string
    type: object
  internal_modules_catalog.AssignAuthorRequest:
    properties:
      author_id:
        type: integer
      role:
        enum:
        - primary
        - co-author
        - editor
        - illustrator
        type: string
    required:
    - author_id
    - role
    type: object
  internal_modules_catalog.AuthorResponse:
    properties:
      biography:
        type: string
      date_of_birth:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: integer
      image:
        type: string
      last_name:
        type: string
      middle_name:
        type: string
    type: object
  internal_modules_catalog.BookResponse:
    properties:
      authors:
        items:
          $ref: '#/definitions/internal_modules_catalog.AuthorResponse'
        type: array
      available_copies:
        type: integer
      cover_image:
        type: string
      description:
        type: string
      file_format:
        type: string
      genre:
        type: string
      id:
        type: integer
      is_digital:
        type: boolean
      isbn:
        type: string
      published_year:
        type: integer
      title:
        type: string
      total_copies:
        type: integer
    type: object
  internal_modules_catalog.CreateAuthorRequest:
    properties:
      biography:
        maxLength: 2000
        type: string
      date_of_birth:
        type: string
      email:
        type: string
      first_name:
        maxLength: 100
        minLength: 2
        type: string
      image:
        type: string
      last_name:
        maxLength: 100
        minLength: 2
        type: string
      middle_name:
        maxLength: 100
        type: string
      phone:
        maxLength: 20
        type: string
    required:
    - first_name
    - last_name
    type: object
  internal_modules_catalog.CreateBookRequest:
    properties:
      author_ids:
        items:
          type: integer
        minItems: 1
        type: array
      author_roles:
        items:
          type: string
        type: array
      cover_image:
        type: string
      description:
        maxLength: 2000
        type: string
      genre:
        maxLength: 100
        type: string
      is_digital:
        type: boolean
      isbn:
        maxLength: 20
        type: string
      published_year:
        maximum: 2100
        minimum: 1000
        type: integer
      title:
        maxLength: 255
        minLength: 1
        type: string
      total_copies:
        minimum: 1
        type: integer
    required:
    - author_ids
    - genre
    - isbn
    - title
    - total_copies
    type: object
  internal_modules_catalog.UpdateAuthorRequest:
    properties:
      biography:
        maxLength: 2000
        type: string
      date_of_birth:
        type: string
      email:
        type: string
      first_name:
        maxLength: 100
        minLength: 2
        type: string
      image:
        type: string
      last_name:
        maxLength: 100
        minLength: 2
        type: string
      middle_name:
        maxLength: 100
        type: string
      phone:
        maxLength: 20
        type: string
    type: object
  internal_modules_catalog.UpdateBookRequest:
    properties:
      cover_image:
        type: string
      description:
        maxLength: 2000
        type: string
      genre:
        maxLength: 100
        type: string
      is_digital:
        type: boolean
      published_year:
        maximum: 2100
        minimum: 1000
        type: integer
      title:
        maxLength: 255
        minLength: 1
        type: string
      total_copies:
        minimum: 1
        type: integer
    type: object
  internal_modules_reading.BookmarkRequest:
    properties:
      color:
        enum:
        - yellow
        - green
        - blue
        - pink
        - purple
        type: string
      highlight:
        maxLength: 1000
        type: string
      note:
        maxLength: 500
        type: string
      page:
        minimum: 1
        type: integer
    required:
    - page
    type: object
  internal_modules_reading.BookmarkResponse:
    properties:
      book_id:
        type: integer
      color:
        type: string
      highlight:
        type: string
      id:
        type: integer
      note:
        type: string
      page:
        type: integer
    type: object
  internal_modules_reading.ProgressUpdateRequest:
    properties:
      current_chapter:
        maxLength: 255
        type: string
      current_page:
        minimum: 0
        type: integer
      total_pages:
        minimum: 1
        type: integer
    required:
    - total_pages
    type: object
  internal_modules_reading.ReadingSessionResponse:
    properties:
      book_id:
        type: integer
      current_chapter:
        type: string
      current_page:
        type: integer
      is_completed:
        type: boolean
      last_read_at:
        type: string
      progress_pct:
        type: number
      total_pages:
        type: integer
    type: object
  internal_modules_reading.UpdateProgressRequest:
    properties:
      client_updated_at:
        type: string
      current_chapter:
        maxLength: 255
        type: string
      current_page:
        description: |-
          CurrentPage has no "required" tag deliberately — 0 is the valid
          starting value (page 0 / not started yet), and go-playground/validator's
          "required" rejects the zero value for numeric types.
        minimum: 0
        type: integer
      total_pages:
        minimum: 1
        type: integer
    required:
    - client_updated_at
    - total_pages
    type: object
  internal_modules_user.HistoryEntryResponse:
    properties:
      book_id:
        type: integer
      book_title:
        type: string
      current_page:
        type: integer
      is_completed:
        type: boolean
      last_read_at:
        type: string
      progress_pct:
        type: number
      total_pages:
        type: integer
    type: object
  internal_modules_user.LibraryEntryResponse:
    properties:
      added_at:
        type: string
      book_id:
        type: integer
      book_title:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  internal_modules_user.UpdateLibraryStatusRequest:
    properties:
      status:
        enum:
        - wishlist
        - to_read
        - reading
        - completed
        - dropped
        type: string
    required:
    - status
    type: object
  internal_modules_user.UpdateProfileRequest:
    properties:
      bio:
        maxLength: 500
        type: string
      phone_number:
        maxLength: 20
        minLength: 7
        type: string
      profile_picture:
        type: string
    type: object
  internal_modules_user.UpdateUserStatusRequest:
    properties:
      is_active:
        type: boolean
    type: object
  internal_modules_user.UserProfileResponse:
    properties:
      bio:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      last_name:
        type: string
      last_online_at:
        type: string
      phone_number:
        type: string
      profile_picture:
        type: string
      role:
        type: string
      total_books_read:
        type: integer
      total_pages_read:
        type: integer
    type: object
  internal_modules_user.UserResponse:
    properties:
      email:
        type: string
      first_name:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      last_name:
        type: string
      role:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    name: Bibliotheca
    url: https://github.com/dprince-03/Bibliotheca
  description: |-
    Library Management & E-Library System — REST API for authentication, the book catalog, borrowing, reading progress, and member management.
    All endpoints except /health and /auth/* return the shared JSON envelope: {"success", "message"|"error", "data"|"code"}.
  license:
    name: MIT
  title: Bibliotheca API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Verifies credentials and returns access + refresh tokens
      parameters:
      - description: Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_modules_auth.AuthResponse'
              type: object
        "400":
          description: invalid body
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIError'
        "401":
          description: wrong credentials or deactivated account
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIError'
        "422":
          description: validation failed
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIError'
      summary: Log in
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Revokes the given refresh token (does not touch the still-live
        access token — it just expires naturally)
      parameters:
      - description: Refresh token to revoke
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIResponse'
        "400":
          description: invalid body
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIError'
        "422":
          description: validation failed
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIError'
      summary: Log out
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Rotates the refresh token (one-time use — the old one is revoked)
        and returns a new access + refresh token pair
      parameters:
      - description: Current refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_modules_auth.AuthResponse'
              type: object
        "400":
          description: invalid body
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIError'
        "401":
          description: invalid, expired, or already-used refresh token
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIError'
        "422":
          description: validation failed
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIError'
      summary: Refresh tokens
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a member account (role is always "member") and returns
        access + refresh tokens
      parameters:
      - description: Registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_modules_auth.AuthResponse'
              type: object
        "400":
          description: invalid body
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIError'
        "409":
          description: email already registered
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIError'
        "422":
          description: validation failed
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIError'
      summary: Register a new member
      tags:
      - auth
  /authors:
    get:
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIResponse'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.PaginatedResponse'
                  - properties:
                      items:
                        items:
                          $ref: '#/definitions/internal_modules_catalog.AuthorResponse'
                        type: array
                    type: object
              type: object
      summary: List authors
      tags:
      - authors
    post:
      consumes:
      - application/json
      parameters:
      - description: Author details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_catalog.CreateAuthorRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_modules_catalog.AuthorResponse'
              type: object
        "400":
          description: invalid body
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIError'
        "401":
          description: missing/invalid token
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIError'
        "403":
          description: librarian/admin only
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIError'
        "422":
          description: validation failed
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Create an author
      tags:
      - authors
  /authors/{id}:
    delete:
      parameters:
      - description: Author ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIResponse'
        "400":
          description: invalid id
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIError'
        "401":
          description: missing/invalid token
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIError'
        "403":
          description: admin only
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIError'
        "404":
          description: author not found
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Delete an author
      tags:
      - authors
    get:
      parameters:
      - description: Author ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_modules_catalog.AuthorResponse'
              type: object
        "400":
          description: invalid id
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIError'
        "404":
          description: author not found
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIError'
      summary: Get an author
      tags:
      - authors
    put:
      consumes:
      - application/json
      parameters:
      - description: Author ID
        in: path
        name: id
        required: true
        type: integer
      - description: Fields to update (all optional)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_catalog.UpdateAuthorRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_modules_catalog.AuthorResponse'
              type: object
        "400":
          description: invalid id/body
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIError'
        "401":
          description: missing/invalid token
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIError'
        "403":
          description: librarian/admin only
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIError'
        "404":
          description: author not found
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIError'
        "422":
          description: validation failed
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Update an author
      tags:
      - authors
  /authors/{id}/books:
    get:
      parameters:
      - description: Author ID
        in: path
        name: id
        required: true
        type: integer
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIResponse'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.PaginatedResponse'
                  - properties:
                      items:
                        items:
                          $ref: '#/definitions/internal_modules_catalog.BookResponse'
                        type: array
                    type: object
              type: object
        "400":
          description: invalid id
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIError'
        "404":
          description: author not found
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIError'
      summary: List an author's books
      tags:
      - authors
  /books:
    get:
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIResponse'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.PaginatedResponse'
                  - properties:
                      items:
                        items:
                          $ref: '#/definitions/internal_modules_catalog.BookResponse'
                        type: array
                    type: object
              type: object
      summary: List books
      tags:
      - books
    post:
      consumes:
      - application/json
      description: author_ids is required (every author must already exist); author_roles
        is optional and positional. available_copies is set equal to total_copies
        and cannot be set directly.
      parameters:
      - description: Book details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_catalog.CreateBookRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_modules_catalog.BookResponse'
              type: object
        "400":
          description: invalid body, or an author_id doesn't exist
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIError'
        "401":
          description: missing/invalid token
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIError'
        "403":
          description: librarian/admin only
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIError'
        "422":
          description: validation failed
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliotheca_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Create a book
      tags:
      - books
  /books/{id}:
    delete:
      parameters:
      - description: Book ID
        in: path
        name: id
