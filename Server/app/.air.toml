#:schema https://json.schemastore.org/any.json

root = "."
testdata_dir = "testdata"
tmp_dir = "tmp/gateway"

[build]
  args_bin = []
  # Default target is the gateway; docker-compose.dev.yml overrides
  # build.cmd/build.bin/tmp_dir per service container, e.g.
  #   air -c .air.toml --build.cmd "go build -o ./tmp/auth/service ./cmd/auth" \
  #       --build.bin ./tmp/auth/service --tmp_dir tmp/auth
  bin = "./tmp/gateway/service"
  cmd = "go build -o ./tmp/gateway/service ./cmd/gateway"
  delay = 1000

  exclude_dir = ["assets", "tmp", "vendor", "testdata", "storage", "docs", "proto"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html"]
  include_file = []
  kill_delay = "0s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = false

[misc]
  clean_on_exit = false

[proxy]
  app_port = 0
  app_start_timeout = 0
  enabled = false
  proxy_port = 0

[screen]
  clear_on_rebuild = false
  keep_scroll = true
