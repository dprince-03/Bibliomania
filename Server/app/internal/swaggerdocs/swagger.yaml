  /payments/webhook/{provider}:
    post:
      consumes:
      - application/json
      description: 'Called by Stripe or Paystack, not clients — register /api/v1/payments/webhook/stripe
        and /api/v1/payments/webhook/paystack in each dashboard. Stripe: verified
        with Stripe-Signature against STRIPE_WEBHOOK_SECRET. Paystack: x-paystack-signature
