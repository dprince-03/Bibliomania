      - BearerAuth: []
      summary: Delete a bookmark
      tags:
      - reading
  /reading/{bookId}/progress:
    patch:
      consumes:
      - application/json
      description: The plain, always-online counterpart to sync — no client_updated_at;
        the server stamps "now", which always beats an offline client syncing in later
        with an older timestamp.
      parameters:
      - description: Book ID
        in: path
        name: bookId
        required: true
        type: integer
      - description: Current progress
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/reading.ProgressUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_dprince-03_Bibliomania_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/reading.ReadingSessionResponse'
              type: object
        "400":
          description: invalid book id/body
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliomania_internal_utils.APIError'
        "401":
          description: missing/invalid token
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliomania_internal_utils.APIError'
        "404":
          description: book not found
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliomania_internal_utils.APIError'
        "422":
          description: validation failed
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliomania_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Update reading progress (online)
      tags:
      - reading
  /reading/{bookId}/session:
    get:
      parameters:
      - description: Book ID
        in: path
        name: bookId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_dprince-03_Bibliomania_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/reading.ReadingSessionResponse'
              type: object
        "400":
          description: invalid book id
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliomania_internal_utils.APIError'
        "401":
          description: missing/invalid token
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliomania_internal_utils.APIError'
        "404":
          description: no session started yet
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliomania_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Get my reading session for a book
      tags:
      - reading
  /reading/{bookId}/sync:
    patch:
      consumes:
      - application/json
      description: 'For offline clients: send local progress plus when it was last
        updated there. If the server already has a newer client_updated_at, this update
        is silently discarded and the response reflects the server''s existing (newer)
        state — last write wins.'
      parameters:
      - description: Book ID
        in: path
        name: bookId
        required: true
        type: integer
      - description: Local progress + client clock
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/reading.UpdateProgressRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_dprince-03_Bibliomania_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/reading.ReadingSessionResponse'
              type: object
        "400":
          description: invalid book id/body
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliomania_internal_utils.APIError'
        "401":
          description: missing/invalid token
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliomania_internal_utils.APIError'
        "404":
          description: book not found
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliomania_internal_utils.APIError'
        "422":
          description: validation failed
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliomania_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Sync offline reading progress
      tags:
      - reading
  /search:
    get:
      description: q matches book title/description (Postgres full-text), a partial
        title, OR author name. genre/format/author/year are exact-match filters, independent
        of q and each other.
      parameters:
      - description: Free text — matches title/description or author name
        in: query
        name: q
        type: string
      - description: Exact genre match
        in: query
        name: genre
        type: string
      - description: digital or physical
        enum:
        - digital
        - physical
        in: query
        name: format
        type: string
      - description: Author ID (not a name — use q for name search)
        in: query
        name: author
        type: integer
      - description: Exact published_year match
        in: query
        name: year
        type: integer
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_dprince-03_Bibliomania_internal_utils.APIResponse'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/github_com_dprince-03_Bibliomania_internal_utils.PaginatedResponse'
                  - properties:
                      items:
                        items:
                          $ref: '#/definitions/catalog.BookResponse'
                        type: array
                    type: object
              type: object
        "400":
          description: invalid format/author/year parameter
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliomania_internal_utils.APIError'
      summary: Search books
      tags:
      - books
  /users:
    get:
      description: Includes deactivated accounts (unlike most other lookups), so an
        admin can find and reactivate one.
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_dprince-03_Bibliomania_internal_utils.APIResponse'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/github_com_dprince-03_Bibliomania_internal_utils.PaginatedResponse'
                  - properties:
                      items:
                        items:
                          $ref: '#/definitions/user.UserResponse'
                        type: array
                    type: object
              type: object
        "401":
          description: missing/invalid token
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliomania_internal_utils.APIError'
        "403":
          description: admin only
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliomania_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: List every user
      tags:
      - users
  /users/{id}/status:
    patch:
      consumes:
      - application/json
      description: Deactivating blocks the user's next login and revokes their refresh
        tokens (propagated to auth-service via the user.status_changed event, normally
        within a second), and any endpoint that filters to is_active=TRUE (e.g. their
        own GET /users/me starts 404ing, even with a still-valid access token).
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: New status
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.UpdateUserStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliomania_internal_utils.APIResponse'
        "400":
          description: invalid id/body
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliomania_internal_utils.APIError'
        "401":
          description: missing/invalid token
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliomania_internal_utils.APIError'
        "403":
          description: admin only
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliomania_internal_utils.APIError'
        "404":
          description: user not found
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliomania_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Activate or deactivate a user
      tags:
      - users
  /users/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_dprince-03_Bibliomania_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/user.UserProfileResponse'
              type: object
        "401":
          description: missing/invalid token
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliomania_internal_utils.APIError'
        "404":
          description: account deactivated
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliomania_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Get my profile
      tags:
      - users
    patch:
      consumes:
      - application/json
      description: Only touches profile fields (phone_number, bio, profile_picture)
        — no route changes first_name/last_name/email yet.
      parameters:
      - description: Fields to update (all optional)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_dprince-03_Bibliomania_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/user.UserProfileResponse'
              type: object
        "400":
          description: invalid body
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliomania_internal_utils.APIError'
        "401":
          description: missing/invalid token
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliomania_internal_utils.APIError'
        "422":
          description: validation failed
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliomania_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Update my profile
      tags:
      - users
  /users/me/history:
    get:
      description: Reading activity (from session data) — not the same as GET /borrows/my,
        which is checkout history. Served by reading-service since the microservices
        split.
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_dprince-03_Bibliomania_internal_utils.APIResponse'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/github_com_dprince-03_Bibliomania_internal_utils.PaginatedResponse'
                  - properties:
                      items:
                        items:
                          $ref: '#/definitions/reading.HistoryEntryResponse'
                        type: array
                    type: object
              type: object
        "401":
          description: missing/invalid token
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliomania_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Get my reading history
      tags:
      - users
  /users/me/library:
    get:
      description: 'Aggregated by the gateway: shelf entries from user-service, titles
        resolved live (one batch call) from catalog-service. If catalog-service is
        down the shelf is still returned, with empty titles and an X-Degraded: catalog-service
        header.'
      parameters:
      - description: Filter to one status
        enum:
        - wishlist
        - to_read
        - reading
        - completed
        - dropped
        in: query
        name: status
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_dprince-03_Bibliomania_internal_utils.APIResponse'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/github_com_dprince-03_Bibliomania_internal_utils.PaginatedResponse'
                  - properties:
                      items:
                        items:
                          $ref: '#/definitions/internal_gateway.libraryEntry'
                        type: array
                    type: object
              type: object
        "401":
          description: missing/invalid token
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliomania_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Get my library
      tags:
      - users
  /users/me/library/{bookId}:
    patch:
      consumes:
      - application/json
      description: Upsert — calling it again for the same book updates the existing
        entry rather than creating a duplicate.
      parameters:
      - description: Book ID
        in: path
        name: bookId
        required: true
        type: integer
      - description: New status
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.UpdateLibraryStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_dprince-03_Bibliomania_internal_utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/user.LibraryEntryResponse'
              type: object
        "400":
          description: invalid book id/body
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliomania_internal_utils.APIError'
        "401":
          description: missing/invalid token
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliomania_internal_utils.APIError'
        "404":
          description: book not found
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliomania_internal_utils.APIError'
        "422":
          description: validation failed
          schema:
            $ref: '#/definitions/github_com_dprince-03_Bibliomania_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Set a book's status on my library shelf
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and the JWT access token (obtained
      from /auth/login or /auth/register).
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
