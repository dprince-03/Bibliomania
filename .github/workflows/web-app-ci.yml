name: web/app CI

on:
  push:
    branches: [main]
    paths:
      - "Client/web/app/**"
      - "infra/docker/web-app/**"
      - ".github/workflows/web-app-ci.yml"
  pull_request:
    paths:
      - "Client/web/app/**"
      - "infra/docker/web-app/**"
      - ".github/workflows/web-app-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Client/web/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Client/web/app/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
