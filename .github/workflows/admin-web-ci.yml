name: admin/web CI

on:
  push:
    branches: [main]
    paths:
      - "Client/admin/**"
      - "infra/docker/admin-web/**"
      - ".github/workflows/admin-web-ci.yml"
  pull_request:
    paths:
      - "Client/admin/**"
      - "infra/docker/admin-web/**"
      - ".github/workflows/admin-web-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Client/admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Client/admin/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
