name: web/main CD

on:
  push:
    branches: [main]
    paths:
      - "Client/web/main/**"
      - "infra/docker/web-main/**"
      - ".github/workflows/web-main-cd.yml"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: Client/web/main
          file: infra/docker/web-main/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/dprince-03/bibliomania-web-main:latest
            ghcr.io/dprince-03/bibliomania-web-main:${{ github.sha }}
