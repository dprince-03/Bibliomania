name: admin CD

on:
  push:
    branches: [main]
    paths:
      - "Server/admin/**"
      - "infra/docker/admin/**"
      - ".github/workflows/admin-cd.yml"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: Server/admin
          file: infra/docker/admin/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/dprince-03/bibliotheca-admin:latest
            ghcr.io/dprince-03/bibliotheca-admin:${{ github.sha }}
