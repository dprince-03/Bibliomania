name: nginx CD

on:
  push:
    branches: [main]
    paths:
      - "infra/nginx/**"
      - ".github/workflows/nginx-cd.yml"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: infra/nginx
          file: infra/nginx/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/dprince-03/bibliotheca-nginx:latest
            ghcr.io/dprince-03/bibliotheca-nginx:${{ github.sha }}
