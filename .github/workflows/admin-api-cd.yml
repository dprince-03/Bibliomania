name: admin/api CD

on:
  push:
    branches: [main]
    paths:
      - "Client/admin/api/**"
      - "infra/docker/admin-api/**"
      - ".github/workflows/admin-api-cd.yml"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: Client/admin/api
          file: infra/docker/admin-api/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/dprince-03/bibliotheca-admin-api:latest
            ghcr.io/dprince-03/bibliotheca-admin-api:${{ github.sha }}
