name: mobile CI

on:
  push:
    branches: [main]
    paths:
      - "Client/mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "Client/mobile/**"
      - ".github/workflows/mobile-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Client/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
