name: web/main CI

on:
  push:
    branches: [main]
    paths:
      - "Client/web/main/**"
      - "infra/docker/web-main/**"
      - ".github/workflows/web-main-ci.yml"
  pull_request:
    paths:
      - "Client/web/main/**"
      - "infra/docker/web-main/**"
      - ".github/workflows/web-main-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Client/web/main
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Client/web/main/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
