name: app CD

# Builds the prod image and pushes to GHCR — only on push to main, never PRs.
on:
  push:
    branches: [main]
    paths:
      - "Server/app/**"
      - "infra/docker/app/**"
      - ".github/workflows/app-cd.yml"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: Server/app
          file: infra/docker/app/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/dprince-03/bibliotheca-app:latest
            ghcr.io/dprince-03/bibliotheca-app:${{ github.sha }}
