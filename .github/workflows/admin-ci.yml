name: admin CI

on:
  push:
    branches: [main]
    paths:
      - "Server/admin/**"
      - "infra/docker/admin/**"
      - ".github/workflows/admin-ci.yml"
  pull_request:
    paths:
      - "Server/admin/**"
      - "infra/docker/admin/**"
      - ".github/workflows/admin-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Server/admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Server/admin/package-lock.json

      - run: npm ci
      # No "lint"/"build" script — this app was scaffolded in plain-JS mode
      # (nest new --language javascript), which has no compiled build step.
      - run: npm run test
