name: admin/api CI

on:
  push:
    branches: [main]
    paths:
      - "Client/admin/api/**"
      - "infra/docker/admin-api/**"
      - ".github/workflows/admin-api-ci.yml"
  pull_request:
    paths:
      - "Client/admin/api/**"
      - "infra/docker/admin-api/**"
      - ".github/workflows/admin-api-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Client/admin/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Client/admin/api/package-lock.json

      - run: npm ci
      # No "lint"/"build" script — this app was scaffolded in plain-JS mode
      # (nest new --language javascript), which has no compiled build step.
      - run: npm run test
