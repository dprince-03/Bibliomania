version: 2
updates:
  - package-ecosystem: gomod
    directory: /Server/app
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /Client/web/app
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /Client/web/main
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /Client/admin
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /Server/admin
    schedule:
      interval: weekly

  - package-ecosystem: pub
    directory: /Client/mobile
    schedule:
      interval: weekly

  - package-ecosystem: maven
    directory: /Client/desktop
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories:
      - /infra/docker/app
      - /infra/docker/web-app
      - /infra/docker/web-main
      - /infra/docker/admin-web
      - /infra/docker/admin
      - /infra/nginx
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
